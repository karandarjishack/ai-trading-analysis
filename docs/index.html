<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Trading Analysis — Realtime Stock Analysis</title>
<style>
  :root { --bg:#0a0e14; --panel:#11161f; --panel2:#161d29; --line:#232c3d;
          --txt:#e6edf3; --dim:#8b98ab; --green:#22c55e; --red:#ef4444;
          --amber:#f59e0b; --blue:#38bdf8; --purple:#a78bfa; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-variant-numeric:tabular-nums; }
  header { padding:14px 22px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap;
           gap:10px; align-items:center; justify-content:space-between; background:rgba(13,18,25,.82);
           backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
           position:sticky; top:0; z-index:10; }
  h1 { font-size:17px; letter-spacing:2.5px; text-transform:uppercase; font-weight:700; }
  h1 .desk { color:var(--txt); font-weight:400; }
  .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--dim); }
  .badge { padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:600; border:1px solid var(--line);
           transition:border-color .3s, color .3s; }
  .open { color:var(--green); border-color:var(--green); }
  .closed { color:var(--dim); }
  .live-dot { width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block;
              animation:pulse 2s infinite; margin-right:5px; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .indices { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; padding:14px 22px 0; }
  .idx { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px 12px;
         transition:transform .3s cubic-bezier(0.32,0.72,0,1), border-color .3s; }
  .idx:hover { transform:translateY(-2px); border-color:#33415a; }
  .idx .n { font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .idx .p { font-size:16px; font-weight:700; margin-top:2px; }
  .up { color:var(--green); } .down { color:var(--red); }
  .tabs { display:flex; gap:4px; padding:14px 22px 0; }
  .tabpill { position:relative; display:inline-flex; background:#0b0f16; border:1px solid var(--line);
             border-radius:999px; padding:4px; box-shadow:0 4px 16px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04); }
  .tab-indicator { position:absolute; top:4px; left:0; height:calc(100% - 8px); border-radius:999px;
             background:#1c2635; border:1px solid #2d3a4f; box-shadow:0 2px 10px rgba(0,0,0,.4);
             transition:transform .45s cubic-bezier(0.32,0.72,0,1), width .45s cubic-bezier(0.32,0.72,0,1); }
  .tab { position:relative; z-index:1; padding:8px 22px; border-radius:999px; background:transparent;
         color:var(--dim); border:none; cursor:pointer; font-size:12px; font-weight:700;
         text-transform:uppercase; letter-spacing:1.2px; font-family:inherit;
         transition:color .3s, transform .15s; }
  .tab:hover { color:#c6d0de; }
  .tab:active { transform:scale(.95); }
  .tab.active { color:var(--txt); }
  main { padding:0 22px 30px; }
  .tabpanel { display:none; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:18px; margin-top:12px; }
  .tabpanel.active { display:block; animation:panelIn .45s cubic-bezier(0.32,0.72,0,1); }
  @keyframes panelIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  h2.sec { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:1.8px; color:var(--dim);
           margin:26px 0 4px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  h2.sec:first-child { margin-top:6px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:12px; margin-bottom:26px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 16px;
          transition:transform .35s cubic-bezier(0.32,0.72,0,1), box-shadow .35s cubic-bezier(0.32,0.72,0,1), border-color .35s; }
  .card:hover { transform:translateY(-3px); border-color:#33415a; box-shadow:0 14px 34px rgba(0,0,0,.5); }
  @keyframes rise { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
  .card.enter { animation:rise .55s cubic-bezier(0.32,0.72,0,1) backwards; }
  .card .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .card .sym { font-weight:700; font-size:15px; letter-spacing:.3px; }
  .card .px { font-size:14px; font-weight:600; }
  .agent { display:flex; gap:10px; margin:7px 0; font-size:13px; line-height:1.45; }
  .agent .tag { flex:0 0 70px; font-size:10px; font-weight:700; letter-spacing:1px; padding-top:2px; color:#7d8a9e; }
  .agent .body { color:#c6d0de; }
  .news ul { list-style:none; }
  .news li { margin:3px 0; }
  .news .src { color:var(--dim); font-size:11.5px; }
  .levels { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:4px; }
  .lvl { background:#0d1219; border:1px solid var(--line); border-radius:6px; padding:6px; text-align:center; }
  .lvl .k { font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.5px; }
  .lvl .v { font-size:13.5px; font-weight:700; margin-top:2px; }
  .verdict { display:inline-block; padding:4px 14px; border-radius:999px; font-weight:700; font-size:12px;
             letter-spacing:.4px; transition:transform .2s; }
  .v-SETUP{background:rgba(34,197,94,.15);color:var(--green);border:1px solid var(--green)}
  .v-WATCH{background:rgba(245,158,11,.15);color:var(--amber);border:1px solid var(--amber)}
  .v-WAIT{background:rgba(139,152,171,.12);color:var(--dim);border:1px solid var(--dim)}
  .v-SKIP{background:rgba(239,68,68,.15);color:var(--red);border:1px solid var(--red)}
  .tone-bullish{color:var(--green);font-weight:700}.tone-bearish{color:var(--red);font-weight:700}.tone-mixed{color:var(--amber);font-weight:700}
  .empty { color:var(--dim); font-size:13.5px; padding:10px 4px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:8px; }
  th { text-align:left; color:var(--dim); font-weight:600; font-size:11.5px; text-transform:uppercase;
       letter-spacing:.5px; padding:8px 10px; border-bottom:1px solid var(--line); }
  td { padding:8px 10px; border-bottom:1px solid #1a2230; }
  tr { transition:background .25s; }
  tr:hover td { background:#141b28; }
  .wrap { overflow-x:auto; }
  footer { padding:18px 22px 40px; color:var(--dim); font-size:12px; line-height:1.6; border-top:1px solid var(--line); }
  .note { font-size:12px; color:var(--dim); margin:4px 0 12px; }
  html { scroll-behavior:smooth; }
  /* ---- CEO simplicity pass: summary strip, collapsible cards, watchlist tools ---- */
  .summary { display:flex; flex-wrap:wrap; gap:8px; padding:12px 22px 0; align-items:center; }
  .stat { display:inline-flex; align-items:baseline; gap:6px; background:var(--panel); border:1px solid var(--line);
          border-radius:999px; padding:6px 14px; font-size:12px; color:var(--dim); text-decoration:none;
          transition:border-color .3s, transform .2s; cursor:pointer; }
  a.stat:hover { border-color:#33415a; transform:translateY(-1px); }
  .stat b { font-size:14px; color:var(--txt); }
  .stat .g{color:var(--green)} .stat .r{color:var(--red)} .stat .a{color:var(--amber)}
  h2.sec { scroll-margin-top:96px; }
  .card .levelsline { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:12.5px; color:var(--dim); margin:10px 0 4px; }
  .card .levelsline b { font-weight:600; }
  .expandbtn { margin-top:10px; background:transparent; border:1px solid var(--line); color:var(--dim);
               border-radius:999px; padding:6px 16px; font-size:11px; font-weight:700; letter-spacing:1px;
               text-transform:uppercase; cursor:pointer; font-family:inherit;
               transition:color .3s, border-color .3s, transform .15s; }
  .expandbtn:hover { color:var(--txt); border-color:#33415a; }
  .expandbtn:active { transform:scale(.96); }
  .expandbtn .pm { display:inline-block; transition:transform .35s cubic-bezier(0.32,0.72,0,1); font-size:13px; }
  .card.open .expandbtn .pm { transform:rotate(45deg); }
  .detail { max-height:0; overflow:hidden; transition:max-height .5s cubic-bezier(0.32,0.72,0,1); }
  .card.open .detail { max-height:1400px; }
  .detail .agent:first-child { margin-top:10px; }
  .wlbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:12px 0 4px; }
  .wlbar input { flex:1; min-width:200px; background:#0b0f16; border:1px solid var(--line); border-radius:999px;
                 padding:9px 18px; color:var(--txt); font-size:13px; font-family:inherit; outline:none;
                 transition:border-color .3s, box-shadow .3s; }
  .wlbar input:focus { border-color:#33415a; box-shadow:0 0 0 3px rgba(56,189,248,.12); }
  .wlbar input::placeholder { color:#4a5568; }
  .bfilter { display:inline-flex; background:#0b0f16; border:1px solid var(--line); border-radius:999px; padding:3px; }
  .bf { border:none; background:transparent; color:var(--dim); border-radius:999px; padding:6px 14px;
        font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; cursor:pointer;
        font-family:inherit; transition:background .3s, color .3s, transform .15s; }
  .bf:hover { color:#c6d0de; }
  .bf.active { background:#1c2635; color:var(--txt); }
  .bf:active { transform:scale(.95); }
  #wlcount { font-size:12px; color:var(--dim); }
  /* ---- Tech & Chip Predictions section ---- */
  .techsec { border:1px solid var(--line); border-radius:8px; background:var(--panel);
             margin:6px 0 26px; overflow:hidden; scroll-margin-top:96px; }
  .techhead { width:100%; display:flex; justify-content:space-between; align-items:center; gap:10px;
              background:transparent; border:none; color:var(--txt); padding:14px 16px; cursor:pointer;
              font-family:inherit; text-align:left; transition:background .3s; }
  .techhead:hover { background:#121924; }
  .techhead:active { transform:scale(.998); }
  .techhead .tt { font-size:12px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; }
  .techhead .tc { font-size:12px; color:var(--dim); }
  .techhead .tc b { color:var(--txt); }
  .techhead .tchev { font-size:20px; color:var(--dim); transition:transform .35s cubic-bezier(0.32,0.72,0,1); flex:0 0 auto; }
  .techhead.open .tchev { transform:rotate(45deg); }
  .techbody { max-height:0; overflow:hidden; transition:max-height .5s cubic-bezier(0.32,0.72,0,1); }
  .techbody.open { max-height:3200px; }
  .techgroups { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; padding:2px 16px 16px; }
  .techgroup h3 { font-size:11px; letter-spacing:1.5px; color:var(--dim); border-bottom:1px solid var(--line);
                  padding-bottom:6px; margin-bottom:4px; }
  .techgroup h3 .g{color:var(--green)} .techgroup h3 .r{color:var(--red)} .techgroup h3 .a{color:var(--amber)}
  .trow { display:flex; flex-wrap:wrap; gap:4px 10px; align-items:baseline; padding:7px 0;
          border-bottom:1px solid #1a2230; font-size:13px; }
  .trow:last-child { border-bottom:none; }
  .tsym b { font-size:13.5px; } .tname { color:var(--dim); font-size:12px; }
  .tpx { font-weight:600; }
  .tbias { font-size:10.5px; font-weight:700; letter-spacing:.5px; padding:2px 9px; border-radius:999px; }
  .tbias.BULLISH { color:var(--green); background:rgba(34,197,94,.12); }
  .tbias.BEARISH { color:var(--red); background:rgba(239,68,68,.12); }
  .tbias.NEUTRAL { color:var(--dim); background:rgba(139,152,171,.12); }
  .tnote { color:var(--dim); font-size:12px; flex-basis:100%; }
</style>
</head>
<body>
<header>
  <h1>AI <span class="desk">Trading Analysis</span></h1>
  <div class="meta">
    <span><span class="live-dot"></span><span id="upd">loading…</span></span>
    <span class="badge" id="usBadge">US: …</span>
    <span class="badge" id="inBadge">India: …</span>
  </div>
</header>

<div class="indices" id="indices"></div>

<div class="summary" id="summary"></div>

<div class="tabs">
  <div class="tabpill" id="tabpill">
    <div class="tab-indicator" id="tabind"></div>
    <button class="tab active" data-t="US" onclick="switchTab('US')">US Stocks</button>
    <button class="tab" data-t="IN" onclick="switchTab('IN')">India (NSE)</button>
  </div>
</div>

<main>
  <div class="tabpanel active" id="panel-US"></div>
  <div class="tabpanel" id="panel-IN"></div>

  <h2 class="sec" style="margin-top:26px">Full watchlist</h2>
  <div class="wlbar">
    <input id="wlq" placeholder="Search symbol or company…" oninput="WLQ=this.value;renderWL()">
    <div class="bfilter">
      <button class="bf active" onclick="setBiasFilter('',this)">All</button>
      <button class="bf" onclick="setBiasFilter('BULLISH',this)">Bullish</button>
      <button class="bf" onclick="setBiasFilter('BEARISH',this)">Bearish</button>
      <button class="bf" onclick="setBiasFilter('NEUTRAL',this)">Neutral</button>
    </div>
    <span id="wlcount"></span>
  </div>
  <div class="wrap"><table>
    <thead><tr><th>Symbol</th><th>Price</th><th>Chg%</th><th>Vol vs avg</th><th>RSI</th><th>Trend</th><th>Bias</th><th>30-day</th></tr></thead>
    <tbody id="allrows"></tbody>
  </table></div>
</main>

<footer id="disclaimer"></footer>

<script>
let DATA=null, CUR='US';
const SECDEF=[
  ['most_bought','Most Bought','Heavy buying on big volume'],
  ['most_sold','Most Sold','Heavy selling on big volume'],
  ['breakouts','Near Breakout','Hugging the 60-day high on strong volume'],
  ['weak','Weak / Near Lows','Sitting near the 60-day low'],
];
const money=(v,mkt)=> (mkt==='US'?'$':'₹') + Number(v).toLocaleString('en-US',{maximumFractionDigits:2});

function spark(vals, up){
  const w=110,h=32, mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-3-((v-mn)/rg)*(h-6)).toFixed(1)}`).join(' ');
  const c= up?'#22c55e':'#ef4444';
  return `<svg width="${w}" height="${h}"><polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.6"/></svg>`;
}
function card(p,i,animate){
  const d=p.desk||{}, ch=(p.chg_pct>=0);
  const lv=d.charts&&d.charts.levels;
  const news=(d.news||[]).map(n=>`<li>• ${esc(n.title)} <span class="src">— ${esc(n.source||'')}</span></li>`).join('');
  const b=d.bias;
  const biasHtml=b?`<div style="margin:0 0 4px"><span class="verdict ${b.label==='BULLISH'?'v-SETUP':b.label==='BEARISH'?'v-SKIP':'v-WAIT'}">${b.label}</span> <span style="color:#8b98ab;font-size:12px">${esc(b.why)}</span></div>`:'';
  const levelsLine=lv?`<div class="levelsline"><span>Entry <b>${money(lv.entry,p.market)}</b></span><span>Stop <b style="color:#ef4444">${money(lv.stop,p.market)}</b></span><span>Target 1 <b style="color:#22c55e">${money(lv.target_1,p.market)}</b></span><span>Target 2 <b style="color:#22c55e">${money(lv.target_2,p.market)}</b></span></div>`:'';
  const chiefHtml=`<div style="margin-top:8px"><span class="verdict v-${d.chief?.verdict||'WAIT'}">${d.chief?.verdict||'WAIT'}</span> <span style="color:#8b98ab;font-size:12.5px">— ${esc(d.chief?.why||'')}</span></div>`;
  return `<div class="card${animate?' enter':''}"${animate?` style="animation-delay:${Math.min(i*60,480)}ms"`:''}>
    <div class="top"><span class="sym">${esc(p.symbol.replace('.NS',''))} <span style="color:#8b98ab;font-weight:400;font-size:12.5px">${esc(p.name)}</span></span>
    <span class="px ${ch?'up':'down'}">${money(p.price,p.market)} (${ch?'+':''}${p.chg_pct}%)</span></div>
    ${biasHtml}
    ${levelsLine}
    ${chiefHtml}
    <button class="expandbtn" onclick="toggleCard(this)"><span>Details</span> <span class="pm">+</span></button>
    <div class="detail"><div>
      <div class="agent scout"><span class="tag">SCOUT</span><span class="body">${esc(d.scout||'')}</span></div>
      <div class="agent news"><span class="tag">NEWS</span><span class="body"><ul>${news||'<span style="color:#8b98ab">no fresh headlines</span>'}</ul></span></div>
      <div class="agent senti"><span class="tag">SENTIMENT</span><span class="body"><span class="tone-${d.sentiment?.label||'mixed'}">${(d.sentiment?.label||'mixed').toUpperCase()}</span> — ${esc(d.sentiment?.note||'')}</span></div>
      <div class="agent skep"><span class="tag">SKEPTIC</span><span class="body">${esc(d.skeptic||'')}</span></div>
    </div></div>
  </div>`;
}
function toggleCard(btn){
  const c=btn.closest('.card'), open=c.classList.toggle('open');
  btn.querySelector('span').textContent=open?'Hide details':'Details';
}
function toggleTech(mkt){
  const sec=document.getElementById('sec-'+mkt+'-tech');
  sec.querySelector('.techbody').classList.toggle('open');
  sec.querySelector('.techhead').classList.toggle('open');
}
function jumpTech(){
  const sec=document.getElementById('sec-'+CUR+'-tech');
  sec.querySelector('.techbody').classList.add('open');
  sec.querySelector('.techhead').classList.add('open');
  sec.scrollIntoView({behavior:'smooth'});
}
function techRow(s,mkt){
  const ch=s.chg_pct>=0;
  return `<div class="trow"><span class="tsym"><b>${esc(s.symbol.replace('.NS',''))}</b> <span class="tname">${esc(s.name)}</span></span>
    <span class="tpx">${money(s.price,mkt)}</span>
    <span class="${ch?'up':'down'}" style="font-weight:600">${ch?'+':''}${s.chg_pct}%</span>
    <span class="tbias ${s.bias}">${s.bias}</span>
    <span class="tnote">${esc(s.note)}</span></div>`;
}
function techSection(mkt){
  const t=(DATA.tech||{})[mkt];
  if(!t) return '';
  const grp=(key,title,cls,empty)=>{
    const rows=t[key]||[];
    return `<div class="techgroup"><h3>${title} <span class="${cls}">· ${rows.length}</span></h3>
      ${rows.length?rows.map(s=>techRow(s,mkt)).join(''):`<div class="empty">${empty}</div>`}</div>`;
  };
  return `<div class="techsec" id="sec-${mkt}-tech">
    <button class="techhead" onclick="toggleTech('${mkt}')">
      <span class="tt">Tech &amp; Chip Predictions</span>
      <span class="tc"><b>${t.buy.length}</b> buy · <b>${t.up.length}</b> up · <b>${t.down.length}</b> down · <b>${t.watch.length}</b> watch</span>
      <span class="tchev">+</span>
    </button>
    <div class="techbody"><div class="techgroups">
      ${grp('buy','BUY NOW','g','No high-conviction buys right now.')}
      ${grp('up','GOING UP','g','No tech names trending up right now.')}
      ${grp('down','GOING DOWN','r','No tech names trending down right now.')}
      ${grp('watch','WATCH','a','Nothing on watch right now.')}
    </div></div>
  </div>`;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

let firstRender=true, WLQ='', WLB='';
function renderSummary(){
  if(!DATA) return;
  const picks=[];
  for(const [key] of SECDEF) for(const p of DATA.screen[key]) if(p.market===CUR) picks.push({...p,sec:key});
  const setups=picks.filter(p=>(p.desk?.chief?.verdict)==='SETUP').length;
  const bull=picks.filter(p=>p.desk?.bias?.label==='BULLISH').length;
  const bear=picks.filter(p=>p.desk?.bias?.label==='BEARISH').length;
  const chips=SECDEF.map(([key,title])=>{
    const n=picks.filter(p=>p.sec===key).length;
    return `<a class="stat" href="#sec-${CUR}-${key}">${title.toLowerCase()} <b>${n}</b></a>`;
  }).join('');
  const t=(DATA.tech||{})[CUR];
  const techChip=t?`<a class="stat" href="javascript:void(0)" onclick="jumpTech()">Tech &amp; chip <b>${t.buy.length} buy</b></a>`:'';
  document.getElementById('summary').innerHTML=
    `<span class="stat"><b class="g">${setups}</b>&nbsp;setups</span>
     <span class="stat"><b class="g">${bull}</b>&nbsp;bullish</span>
     <span class="stat"><b class="r">${bear}</b>&nbsp;bearish</span>${techChip}${chips}`;
}
function renderWL(){
  if(!DATA) return;
  const q=WLQ.trim().toLowerCase();
  const all=DATA.symbols.filter(s=>s.market===CUR);
  const rows=all
    .filter(s=>!WLB||s.bias===WLB)
    .filter(s=>!q||s.symbol.toLowerCase().includes(q)||(s.name||'').toLowerCase().includes(q));
  document.getElementById('allrows').innerHTML=rows.map(s=>{
    const ch=s.chg_pct>=0;
    const bb=s.bias?`<span class="${s.bias==='BULLISH'?'up':s.bias==='BEARISH'?'down':''}" style="font-weight:700;font-size:12px">${s.bias}</span>`:'–';
    return `<tr><td><b>${esc(s.symbol.replace('.NS',''))}</b><br><span style="color:#8b98ab;font-size:11.5px">${esc(s.name)}</span></td>
      <td>${money(s.price,s.market)}</td><td class="${ch?'up':'down'}">${ch?'+':''}${s.chg_pct}%</td>
      <td>${s.vol_ratio}x</td><td>${s.rsi_14??'–'}</td><td>${s.trend}</td><td>${bb}</td><td>${spark(s.spark,ch)}</td></tr>`;
  }).join('');
  document.getElementById('wlcount').textContent=rows.length+' of '+all.length+' shown';
}
function setBiasFilter(b,btn){
  WLB=b;
  document.querySelectorAll('.bf').forEach(e=>e.classList.toggle('active',e===btn));
  renderWL();
}
function render(animate){
  if(!DATA) return;
  if(animate===undefined) animate=false;
  const ix=DATA.indices;
  document.getElementById('indices').innerHTML = Object.entries(ix).map(([k,v])=>{
    const ch=v.chg_pct>=0;
    return `<div class="idx"><div class="n">${esc(v.name)}</div><div class="p">${money(v.price, v.market||'US')}</div>
      <div class="${ch?'up':'down'}" style="font-size:13px;font-weight:600">${ch?'+':''}${v.chg_pct}%</div></div>`;
  }).join('');
  const ms=DATA.market_status;
  const ub=document.getElementById('usBadge'), ib=document.getElementById('inBadge');
  ub.textContent='US: '+(ms.us_open?'OPEN':'CLOSED'); ub.className='badge '+(ms.us_open?'open':'closed');
  ib.textContent='India: '+(ms.india_open?'OPEN':'CLOSED'); ib.className='badge '+(ms.india_open?'open':'closed');
  document.getElementById('disclaimer').textContent=DATA.disclaimer+' Data refreshes automatically during market hours.';
  for(const mkt of ['US','IN']){
    const el=document.getElementById('panel-'+mkt);
    el.innerHTML=techSection(mkt)+SECDEF.map(([key,title,sub])=>{
      const picks=DATA.screen[key].filter(p=>p.market===mkt);
      return `<h2 class="sec" id="sec-${mkt}-${key}">${title} <span style="color:#4a5568">· ${picks.length}</span></h2><div class="note">${sub}</div>
        ${picks.length?`<div class="cards">${picks.map((p,i)=>card(p,i,animate)).join('')}</div>`:'<div class="empty">Nothing on the tape right now.</div>'}`;
    }).join('');
  }
  renderSummary();
  renderWL();
  tick();
}
function tick(){
  if(!DATA) return;
  const t=new Date(DATA.generated_at_utc.replace(' UTC','Z'));
  const m=Math.max(0,Math.round((Date.now()-t.getTime())/60000));
  document.getElementById('upd').textContent=`updated ${m} min ago · auto-refreshes`;
}
function moveInd(){
  const a=document.querySelector('.tab.active'), ind=document.getElementById('tabind');
  if(a&&ind){ ind.style.width=a.offsetWidth+'px'; ind.style.transform=`translateX(${a.offsetLeft}px)`; }
}
function switchTab(m){ CUR=m;
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.t===m));
  document.querySelectorAll('.tabpanel').forEach(e=>e.classList.toggle('active',e.id==='panel-'+m));
  moveInd(); render(true);
}
async function load(){
  try{ const r=await fetch('data/market.json?t='+Date.now()); DATA=await r.json(); render(firstRender); firstRender=false; }
  catch(e){ document.getElementById('upd').textContent='could not load data'; }
}
load(); setInterval(load, 5*60*1000); setInterval(tick, 30000);
window.addEventListener('resize', moveInd);
setTimeout(moveInd, 100);
</script>
</body>
</html>
