---
name: Probe data sources
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate sources
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          probe() { code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 -A "$UA" "$2"); echo "$code  $1"; }
          probe "yahoo-query1-chart" "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=5d"
          probe "yahoo-query2-chart" "https://query2.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=5d"
          probe "yahoo-search" "https://query1.finance.yahoo.com/v1/finance/search?q=AAPL"
          probe "stooq-quote" "https://stooq.com/q/l/?s=aapl.us,reliance.in&f=sd2t2ohlcv&h&e=csv"
          probe "stooq-history" "https://stooq.com/q/d/l/?s=aapl.us&i=d"
          probe "nasdaq-screener" "https://api.nasdaq.com/api/screener/stocks?tableonly=true&limit=5&offset=0"
          probe "nasdaq-historical" "https://api.nasdaq.com/api/quote/AAPL/historical?assetclass=stocks&fromdate=2026-09-01&limit=9999"
          probe "nse-bhavcopy" "https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_09102026.csv"
---
