name: Update market data

on:
  schedule:
    - cron: '*/30 4-19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run screener
        run: python3 scripts/fetch.py
      - name: Commit fresh data
        run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add docs/data/market.json
          git diff --cached --quiet || (git commit -m "Refresh market data" && git push)
